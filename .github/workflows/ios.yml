name: RoomScan iOS

on:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate the Xcode project
        working-directory: ios/RoomScan
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build for iPhone (unsigned)
        working-directory: ios/RoomScan
        run: |
          xcodebuild -version
          xcodebuild -project RoomScan.xcodeproj -target RoomScan -configuration Release \
            -sdk iphoneos SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package an unsigned .ipa (re-sign with Sideloadly, AltStore or Xcode)
        working-directory: ios/RoomScan
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/RoomScan.app Payload/
          zip -qr RoomScan-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: RoomScan-unsigned-ipa
          path: ios/RoomScan/RoomScan-unsigned.ipa

  # Signs with your Apple Developer account and uploads to TestFlight. Off until these repo
  # secrets exist (see ios/RoomScan/README.md): APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8.
  # Xcode's cloud signing makes the certificate and profile itself; no Mac or keychain needed.
  testflight:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: macos-latest
    steps:
      - name: Are the App Store Connect secrets set?
        id: asc
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -n "$TEAM" ] && [ -n "$KEY_ID" ] && [ -n "$ISSUER" ] && [ -n "$P8" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::TestFlight upload skipped: add APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID and ASC_KEY_P8 secrets to turn it on."
          fi
      - uses: actions/checkout@v4
        if: steps.asc.outputs.ready == 'true'
      - name: Archive, sign and upload to TestFlight
        if: steps.asc.outputs.ready == 'true'
        working-directory: ios/RoomScan
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          P8: ${{ secrets.ASC_KEY_P8 }}
          BUILD: ${{ github.run_number }}
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen generate
          key="$RUNNER_TEMP/AuthKey_$KEY_ID.p8"
          printf '%s\n' "$P8" > "$key"
          auth=(-allowProvisioningUpdates -authenticationKeyPath "$key"
                -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER")
          xcodebuild -project RoomScan.xcodeproj -scheme RoomScan -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/RoomScan.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic CURRENT_PROJECT_VERSION="$BUILD" \
            "${auth[@]}" archive
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/RoomScan.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            "${auth[@]}"
          rm -f "$key"
          echo "::notice::Build $BUILD uploaded. It shows up in TestFlight once Apple has processed it (usually 5-30 minutes)."
