name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # No wrapper jar in the repo (nothing on the headset can generate one),
      # so let setup-gradle provision a pinned Gradle.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/quest-claude.apk

      - uses: actions/upload-artifact@v4
        with:
          name: quest-claude-apk
          path: dist/quest-claude.apk
          retention-days: 30

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        # The cwaude job may have created the release first.
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes || true
          gh release upload "$GITHUB_REF_NAME" dist/quest-claude.apk --clobber

  # Exec spike (spike/): proot + Ubuntu with no Termux, at targetSdk 34. Its own job so a
  # broken download never blocks the main APK.
  spike:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Fetch proot and the Ubuntu rootfs
        run: |
          sudo apt-get install -y -qq patchelf
          scripts/fetch-ubuntu-prebuilts.sh spike

      - name: Build spike APK
        run: gradle --no-daemon :spike:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: quest-claude-spike-apk
          path: spike/build/outputs/apk/debug/spike-debug.apk
          retention-days: 30

  # Cwaude (cwaude/): Quest Claude without Termux, running its own Ubuntu.
  cwaude:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Fetch proot and the Ubuntu rootfs
        run: |
          sudo apt-get install -y -qq patchelf
          scripts/fetch-ubuntu-prebuilts.sh cwaude

      - name: Build Cwaude APK
        run: gradle --no-daemon :cwaude:assembleDebug

      - name: Rename APK
        run: |
          mkdir -p dist
          cp cwaude/build/outputs/apk/debug/cwaude-debug.apk dist/cwaude.apk

      - uses: actions/upload-artifact@v4
        with:
          name: cwaude-apk
          path: dist/cwaude.apk
          retention-days: 30

      # The README's download link points at releases/latest/download/qlaude.apk.
      - name: Publish to the release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp dist/cwaude.apk dist/qlaude.apk
          gh release create "$GITHUB_REF_NAME" --generate-notes || true
          gh release upload "$GITHUB_REF_NAME" dist/qlaude.apk --clobber
